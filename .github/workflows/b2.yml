name: Build b2

on:
  push:
    branches:
      - master
      - wip/master
      - wip/ci_test

jobs:
  build-linux-x64-gcc-ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci-ubuntu-gcc-ffmpeg UPLOAD=1
        env:
          GH_TOKEN: ${{ github.token }}
        
  build-linux-x64-clang-ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci-ubuntu-clang-ffmpeg

  build-linux-arm-gcc-ffmpeg:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci-ubuntu-gcc-ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        
  build-linux-arm-clang-ffmpeg:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci-ubuntu-clang-ffmpeg

  build-linux-x64-gcc-no_ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci-ubuntu-gcc-no_ffmpeg

  build-windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci_windows UPLOAD=1 VSYEAR=2022
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make -f "bin/install_windows_arm_prerequisites.mak"
        timeout-minutes: 10
      - name: Gather VS installer logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vs_logs | Out-Null
          Copy-Item "$env:TEMP\dd_*.log" vs_logs -ErrorAction SilentlyContinue
          Get-ChildItem vs_logs
          # Show the interesting lines in the job log too
          Select-String -Path vs_logs\*.log -Pattern 'error|fail|0x80|exit code' | Select-Object -Last 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs-installer-logs
          path: vs_logs
      - run: make github_ci_windows UPLOAD=1 VSYEAR=2026
        env:
          GH_TOKEN: ${{ github.token }}
          
  build-older-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci_macos_homebrew
      - run: make github_ci_older_macos_x64
        env:
          GH_TOKEN: ${{ github.token }}
          
  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: make github_ci_macos_homebrew
      - run: make github_ci_macos_homebrew_ffmpeg
      - run: make github_ci_macos_arm
        env:
          GH_TOKEN: ${{ github.token }}
